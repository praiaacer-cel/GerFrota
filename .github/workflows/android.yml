name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Cache automático das dependências do app

      - name: 📦 Cache do Gradle Wrapper (Previne o erro 503)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: 🔑 Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: 🛠️ Build do APK (com lógica de retry para falhas de rede)
        run: |
          echo "Iniciando build do APK..."
          # Tenta executar o build até 3 vezes. Se der erro 503, espera 15s e tenta de novo.
          for i in 1 2 3; do
            ./gradlew assembleDebug --stacktrace --no-daemon && break
            echo "⚠️ Falha na tentativa $i (possível erro 503 de rede). Aguardando 15 segundos..."
            sleep 15
          done
