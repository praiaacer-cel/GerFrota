name: GerFrota Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4
      with:
        submodules: recursive # Essencial para baixar o llama.cpp corretamente
        fetch-depth: 0        # 🚨 MÁGICA: Necessário para o CMake do llama.cpp ler o .git e gerar o build-info

    # ✅ ADICIONE ESTE PASSO:
    - name: Clone llama.cpp dependency
      run: |
        if [ ! -d "llama.cpp" ]; then
          echo "Cloning llama.cpp..."
          # O --depth 1 faz um clone raso, deixando o CI muito mais rápido
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama.cpp
        fi

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'       # 🚨 MÁGICA: Cache nativo e otimizado do Gradle

    - name: Configurar Android SDK e Aceitar Licenças
      run: |
        # Aceita todas as licenças do Android SDK para evitar prompts interativos
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        # Garante que as plataformas e build tools necessárias estejam instaladas
        sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

    - name: Configurar Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    # 🚨 CORREÇÃO CRÍTICA: Injeção do local.properties
    # O settings.gradle.kts do seu projeto EXIGE o caminho do Flutter.
    # Este step descobre onde o Flutter foi instalado e cria o arquivo dinamicamente.
    - name: Criar local.properties para o Gradle
      run: |
        FLUTTER_PATH=$(dirname $(dirname $(which flutter)))
        echo "flutter.sdk=$FLUTTER_PATH" > local.properties
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        echo "✅ Arquivo local.properties criado:"
        cat local.properties

    - name: Permissão de execução para o Gradlew
      run: chmod +x ./gradlew

    - name: Build do APK (Debug)
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload do APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
