name: Build APK Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: ☕ Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 📦 Cache do Gradle Wrapper (Previne o erro 503)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: 🔑 Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: 🛠️ Build do APK (com lógica de retry para falhas de rede)
        run: |
          SUCCESS=0
          for i in 1 2 3; do
            if ./gradlew assembleDebug --stacktrace --no-daemon; then
              SUCCESS=1
              break
            fi
            echo "⚠️ Falha na tentativa $i. Aguardando 15 segundos..."
            sleep 15
          done
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ Build falhou nas 3 tentativas."
            exit 1
          fi

      - name: 📤 Upload do APK (gera a seção Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
